<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/icon.jpeg">
  <title>Colors – Blue Diamond Admin</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    .list-page { max-width: 600px; margin: 0 auto; padding: 24px 16px; }
    .add-form-card {
      background: white;
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 24px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
    }
    .add-form-card h3 { font-size: 0.95rem; font-weight: 700; margin-bottom: 14px; color: var(--text-dark); }
    .add-row { display: flex; gap: 10px; }
    .add-row input {
      flex: 1;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.9rem;
      outline: none;
    }
    .add-row input:focus { border-color: var(--blue-main); }
    .btn-add-item {
      background: var(--blue-main);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .btn-add-item:hover { background: var(--blue-dark); }
    .items-list { display: flex; flex-direction: column; gap: 8px; }
    .item-row {
      background: white;
      border-radius: var(--radius);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }
    .item-name { flex: 1; font-size: 0.9rem; font-weight: 500; }
    .item-edit-input {
      flex: 1;
      border: 1.5px solid var(--blue-main);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.9rem;
      outline: none;
    }
    .btn-edit, .btn-save-edit, .btn-delete, .btn-cancel-edit {
      border: none;
      border-radius: 6px;
      width: 28px;
      height: 28px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.15s;
    }
    .btn-edit { background: var(--blue-pale); color: var(--blue-dark); }
    .btn-edit:hover { background: #BBDEFB; }
    .btn-save-edit { background: var(--blue-main); color: white; }
    .btn-save-edit:hover { background: var(--blue-dark); }
    .btn-delete { background: var(--red-light); color: var(--red); }
    .btn-delete:hover { background: #FFCDD2; }
    .btn-cancel-edit { background: #F5F5F5; color: var(--text-mid); }
    .empty-msg { text-align: center; color: var(--text-light); padding: 40px 0; font-size: 0.9rem; }
    #authGuard { display: flex; align-items: center; justify-content: center; min-height: 60vh; font-size: 0.9rem; color: var(--text-light); }
    #pageContent { display: none; }
  </style>
</head>
<body>

  <header class="admin-header">
    <div class="admin-brand">
      <a href="index.html" class="back-btn" aria-label="Back">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
      </a>
      <div><h1>Colors</h1></div>
    </div>
  </header>

  <div id="authGuard">Checking auth…</div>

  <div id="pageContent">
    <div class="list-page">
      <div class="add-form-card">
        <h3>Add Color</h3>
        <div class="add-row">
          <input type="text" id="newColorName" placeholder="Color name e.g. Terracotta Red" autocomplete="off">
          <button class="btn-add-item" id="addColorBtn">Add</button>
        </div>
      </div>
      <div class="items-list" id="colorList">
        <p class="empty-msg">Loading…</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/colors.js"></script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
