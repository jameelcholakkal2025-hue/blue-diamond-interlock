<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Blue Diamond">
  <meta name="theme-color" content="#1B3D6F">
  <title>Catalogue – Blue Diamond Interlock</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ── Header ── -->
  <header>
    <div class="header-inner">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        <a href="home.html" class="back-btn" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </a>
        <span style="font-size:1.05rem;font-weight:700;color:white;letter-spacing:0.2px;">Our Products</span>
      </div>
      <div class="header-actions"></div>
    </div>
  </header>

  <!-- ── Filter bar ── -->
  <div class="filter-bar">
    <div class="search-row">
      <div class="search-wrap">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search products…" autocomplete="off" autocorrect="off">
      </div>
    </div>
    <div class="cats-scroll" id="categoryBtns"></div>
  </div>

  <!-- ── Product grid ── -->
  <main class="catalogue-section">
    <div class="section-header">
      <h2>All Products</h2>
      <span class="product-count" id="productCountLabel">Loading…</span>
    </div>
    <div id="productGrid"></div>
    <div id="emptyState">
      <svg width="64" height="64" viewBox="0 0 200 200" fill="none" opacity="0.25">
        <polygon points="100,18 60,58 80,78 100,58 120,38" fill="#1B3D6F"/>
        <polygon points="100,182 60,142 80,122 100,142 120,162" fill="#1B3D6F"/>
        <polygon points="100,68 132,100 100,132 68,100" fill="#4BAAD6"/>
      </svg>
      <p>No products found.</p>
    </div>
  </main>

  <!-- ── Product modal ── -->
  <div id="productModal" role="dialog" aria-modal="true">
    <div class="modal-box">
      <div class="modal-handle"></div>
      <div class="modal-img" id="modalImg"></div>
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalName"></h2>
          <button id="closeModal" aria-label="Close">✕</button>
        </div>
        <div class="modal-meta">
          <span class="meta-badge" id="modalBadge"></span>
          <span class="meta-badge" id="modalSize"></span>
          <span class="meta-badge" id="modalColor"></span>
        </div>
        <p id="modalDesc"></p>
        <div class="modal-price-row">
          <span class="modal-price" id="modalPrice"></span>
          <button class="wa-btn-full" id="modalWA">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
            Enquire on WhatsApp
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Sticky WA bar ── -->
  <div class="wa-sticky-bar">
    <div class="info">
      <div class="name">Blue Diamond Interlock</div>
      <div class="number">9048 50 98 58 · 9048 50 98 54</div>
    </div>
    <button class="wa-sticky-btn" onclick="whatsappCall()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Chat Now
    </button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/main.js"></script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
