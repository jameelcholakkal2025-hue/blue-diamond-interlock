<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/icon.jpeg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Blue Diamond">
  <title>Admin – Blue Diamond Interlock</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body>

  <!-- Admin Header -->
  <header class="admin-header">
    <a href="home.html" aria-label="Home" class="menu-btn" title="Go to Home" style="text-decoration:none;">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
    </a>
    <div style="position:absolute;left:50%;transform:translateX(-50%);">
      <h1 style="font-size:1.05rem;font-weight:700;color:white;margin:0;">Admin Dashboard</h1>
    </div>
    <div class="header-right" id="headerRight">
      <div class="share-wrap" id="shareWrap">
        <button class="share-icon-btn" onclick="toggleShareMenu(event)" aria-label="Share links">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
        </button>
        <div class="share-dropdown" id="shareDropdown">
          <button class="share-option" onclick="shareLink('https://blue-diamond-3229a.web.app/home.html', 'Blue Diamond Interlock – Home')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Share Home Page
          </button>
          <button class="share-option" onclick="shareLink('https://blue-diamond-3229a.web.app/catalogue.html', 'Blue Diamond – View Products')">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            Share Catalogue
          </button>
        </div>
      </div>
      <button class="menu-btn" id="menuBtn" style="display:none" onclick="toggleMenu()" aria-label="Menu">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round">
          <line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- PWA Install Banner -->
  <div id="pwaInstallBanner" style="display:none;background:#1B3D6F;color:white;padding:10px 16px;display:none;align-items:center;justify-content:space-between;gap:12px;font-size:0.88rem;">
    <span>Install Blue Diamond app for quick access</span>
    <div style="display:flex;gap:8px;flex-shrink:0;">
      <button id="pwaInstallBtn" style="background:white;color:#1B3D6F;border:none;border-radius:6px;padding:6px 14px;font-weight:700;cursor:pointer;font-size:0.85rem;">Install</button>
      <button id="pwaInstallDismiss" style="background:rgba(255,255,255,0.15);color:white;border:none;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:0.85rem;">✕</button>
    </div>
  </div>

  <!-- Login Section -->
  <div id="loginSection" style="display:none">
    <div class="login-card">
      <img src="assets/logo.svg" alt="Blue Diamond Logo">
      <h2>Admin Login</h2>
      <p>Sign in with your Firebase admin account.</p>
      <form id="loginForm">
        <div class="form-group">
          <label for="adminEmail">Email</label>
          <input type="email" id="adminEmail" placeholder="admin@bluediamond.com" required autocomplete="username">
        </div>
        <div class="form-group">
          <label for="adminPass">Password</label>
          <div class="pass-wrap">
            <input type="password" id="adminPass" placeholder="Enter password" required autocomplete="current-password">
            <button type="button" class="eye-btn" id="togglePass" aria-label="Show password">
              <!-- eye open -->
              <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <!-- eye closed (hidden by default) -->
              <svg id="eyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
        </div>
        <button type="submit" class="btn-primary">Login</button>
        <p class="error-msg" id="loginError"></p>
      </form>
    </div>
  </div>

  <!-- Dashboard Section -->
  <div id="dashSection" style="display:none">

    <!-- Stats -->
    <div class="stats-row">
      <div class="stat-card stat-products">
        <div class="stat-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-4 0v2M8 7V5a2 2 0 0 0-4 0v2"/>
          </svg>
        </div>
        <div class="stat-body">
          <div class="stat-num" id="totalCount">0</div>
          <div class="stat-lbl">Products</div>
        </div>
      </div>
      <div class="stat-card stat-featured">
        <div class="stat-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
          </svg>
        </div>
        <div class="stat-body">
          <div class="stat-num" id="featuredCount">0</div>
          <div class="stat-lbl">Featured</div>
        </div>
      </div>
      <div class="stat-card stat-stock">
        <div class="stat-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="stat-body">
          <div class="stat-num" id="stockCount">0</div>
          <div class="stat-lbl">In Stock</div>
        </div>
      </div>
      <div class="stat-card stat-customers">
        <div class="stat-icon">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <div class="stat-body">
          <div class="stat-num" id="customerCount">0</div>
          <div class="stat-lbl">Customers</div>
        </div>
      </div>
    </div>

    <!-- Products table -->
    <div class="toolbar">
      <h2>All Products</h2>
      <button class="btn-add" id="addNewBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Add New Product
      </button>
    </div>

    <div class="product-list" id="productList">
      <p class="list-empty">Loading products…</p>
    </div>

  </div>

  <!-- Toast notification -->
  <div class="toast" id="toast"></div>

  <!-- Slide Menu -->
  <div id="menuOverlay" class="slide-overlay" onclick="toggleMenu()"></div>
  <div id="slideMenu" class="slide-menu">
    <div class="slide-menu-header">
      <span>Menu</span>
      <button class="slide-close-btn" onclick="toggleMenu()" aria-label="Close">✕</button>
    </div>
    <a href="catalogue.html" class="slide-menu-item" onclick="toggleMenu()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      View Products
    </a>
    <a href="home.html" class="slide-menu-item" onclick="toggleMenu()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      View Home
    </a>
    <a href="colors.html" class="slide-menu-item" onclick="toggleMenu()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/></svg>
      Colors
    </a>
    <a href="categories.html" class="slide-menu-item" onclick="toggleMenu()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      Categories
    </a>
    <button class="slide-menu-item slide-menu-logout" id="menuLogout">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
      Logout
    </button>
  </div>

  <!-- Firebase compat SDK (works without a module bundler) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/admin.js"></script>
  <script>
    function toggleShareMenu(e) {
      e.stopPropagation();
      document.getElementById('shareDropdown').classList.toggle('open');
    }
    document.addEventListener('click', () => {
      document.getElementById('shareDropdown').classList.remove('open');
    });
    async function shareLink(url, title) {
      document.getElementById('shareDropdown').classList.remove('open');
      if (navigator.share) {
        await navigator.share({ title, url });
      } else {
        await navigator.clipboard.writeText(url);
        alert('Link copied: ' + url);
      }
    }
  </script>
<script>
  if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");

  // iOS: show "Add to Home Screen" guidance instead of beforeinstallprompt
  const _isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const _isStandalone = window.navigator.standalone;
  if (_isIOS && !_isStandalone && !localStorage.getItem('iosBannerDismissed')) {
    const banner = document.getElementById('pwaInstallBanner');
    banner.querySelector('span').textContent = '';
    banner.querySelector('span').innerHTML = 'Add to Home Screen: tap Share 📤 then <strong>Add to Home Screen</strong>';
    document.getElementById('pwaInstallBtn').style.display = 'none';
    banner.style.display = 'flex';
  }
  document.getElementById('pwaInstallDismiss').addEventListener('click', () => {
    document.getElementById('pwaInstallBanner').style.display = 'none';
    localStorage.setItem('iosBannerDismissed', '1');
  });

  // Android/Chrome: beforeinstallprompt
  let _deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    _deferredPrompt = e;
    if (!_isIOS) document.getElementById('pwaInstallBanner').style.display = 'flex';
  });
  document.getElementById('pwaInstallBtn').addEventListener('click', async () => {
    if (!_deferredPrompt) return;
    _deferredPrompt.prompt();
    const { outcome } = await _deferredPrompt.userChoice;
    _deferredPrompt = null;
    document.getElementById('pwaInstallBanner').style.display = 'none';
  });
  window.addEventListener('appinstalled', () => {
    document.getElementById('pwaInstallBanner').style.display = 'none';
    _deferredPrompt = null;
  });
</script>
</body>
</html>
