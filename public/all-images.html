<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1B3D6F">
  <title>All Photos – Blue Diamond</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .all-images-grid {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 14px 14px 100px;
    }
    .all-img-item {
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #e8f0f7;
      box-shadow: 0 2px 10px rgba(27,61,111,0.10);
    }
    .all-img-item img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }
    .all-images-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 60px 20px;
      color: #6B7A8D;
      font-size: 0.9rem;
    }
    .all-images-count {
      font-size: 0.8rem;
      color: #6B7A8D;
      text-align: center;
      padding: 10px 0 4px;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-inner">
      <div style="display:flex;align-items:center;gap:10px;flex:1;min-width:0">
        <button class="back-btn" onclick="history.back()" aria-label="Back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <span id="pageTitle" style="font-size:1.05rem;font-weight:700;color:white;letter-spacing:0.2px;">All Photos</span>
      </div>
      <div class="header-actions"></div>
    </div>
  </header>

  <div class="all-images-loading" id="loading">
    <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#4BAAD6" stroke-width="2">
      <circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
    </svg>
    Loading photos…
  </div>

  <div id="content" style="display:none">
    <p class="all-images-count" id="imgCount"></p>
    <div class="all-images-grid" id="imgGrid"></div>
  </div>

  <div class="wa-sticky-bar">
    <div class="info">
      <div class="name">Blue Diamond Interlock</div>
      <div class="number">9048 50 98 58 · 9048 50 98 54</div>
    </div>
    <button class="wa-sticky-btn" onclick="window.open('https://wa.me/919048509858','_blank')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
      Chat Now
    </button>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
    const FIREBASE_CONFIG = {
      apiKey:            "AIzaSyByDrvOSrRX5W261QAue83aACVE7nKdFkg",
      authDomain:        "blue-diamond-3229a.firebaseapp.com",
      projectId:         "blue-diamond-3229a",
      storageBucket:     "blue-diamond-3229a.firebasestorage.app",
      messagingSenderId: "245929462285",
      appId:             "1:245929462285:web:130ae52fa440dbdc262344"
    };
    if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
    const db = firebase.firestore();

    async function init() {
      const id = new URLSearchParams(window.location.search).get('id');
      if (!id) { history.back(); return; }

      try {
        const snap = await db.collection('products').doc(id).get();
        if (!snap.exists) { history.back(); return; }
        const p = { id: snap.id, ...snap.data() };
        const images = (p.images && p.images.length) ? p.images : (p.image ? [p.image] : []);

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
        document.getElementById('pageTitle').textContent = p.name;
        document.title = p.name + ' – All Photos';
        document.getElementById('imgCount').textContent = images.length + ' photo' + (images.length !== 1 ? 's' : '');

        document.getElementById('imgGrid').innerHTML = images.map((url, i) => `
          <div class="all-img-item">
            <img src="${url}" alt="${p.name} photo ${i + 1}" loading="lazy">
          </div>
        `).join('');
      } catch (err) {
        document.getElementById('loading').innerHTML =
          '<p style="color:#c62828;padding:20px">Failed to load photos. Check connection.</p>';
      }
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
