<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/assets/icon.jpeg">
  <title>Product – Blue Diamond Admin</title>
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg">
  <link rel="stylesheet" href="css/admin.css">
  <style>
    /* ── Multi-image upload section ── */
    .media-section { margin-top: 8px; }

    .media-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
      gap: 10px;
    }

    .media-thumb {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      overflow: hidden;
      background: var(--blue-pale);
      border: 2.5px solid transparent;
      cursor: pointer;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .media-thumb img, .media-thumb video {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }
    .media-thumb.primary {
      border-color: var(--blue-main);
      box-shadow: 0 0 0 3px rgba(21,101,192,0.18);
    }

    .primary-badge {
      display: none;
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: var(--blue-main);
      color: white;
      font-size: 0.6rem;
      font-weight: 700;
      text-align: center;
      padding: 3px 0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .media-thumb.primary .primary-badge { display: block; }

    .media-remove {
      position: absolute;
      top: 4px; right: 4px;
      width: 22px; height: 22px;
      background: rgba(0,0,0,0.55);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 0.75rem;
      line-height: 1;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      opacity: 0;
      transition: opacity 0.15s;
    }
    .media-thumb:hover .media-remove { opacity: 1; }

    /* Upload progress per image */
    .media-thumb-uploading {
      position: relative;
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      background: var(--blue-pale);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--text-light);
    }
    .mini-progress {
      width: 70%;
      height: 4px;
      background: var(--border);
      border-radius: 4px;
      overflow: hidden;
    }
    .mini-progress-bar {
      height: 100%;
      background: var(--blue-main);
      border-radius: 4px;
      transition: width 0.2s;
      width: 0%;
    }

    /* Add more button */
    .media-add-btn {
      aspect-ratio: 1 / 1;
      border-radius: 10px;
      border: 2px dashed var(--border);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
      color: var(--text-light);
      font-size: 0.75rem;
      font-weight: 600;
      transition: border-color 0.2s, color 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .media-add-btn:hover { border-color: var(--blue-main); color: var(--blue-main); }
    .media-add-btn svg { opacity: 0.6; }

    .media-hint {
      font-size: 0.75rem;
      color: var(--text-light);
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <header class="admin-header" style="display:flex;align-items:center;justify-content:space-between;padding:0 16px;">
    <a href="index.html" class="back-btn" aria-label="Back">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
        <polyline points="15 18 9 12 15 6"/>
      </svg>
    </a>
    <h1 id="pageTitle" style="flex:1;text-align:center;font-size:1rem;font-weight:700;margin:0;">Add New Product</h1>
    <div style="flex-shrink:0;width:72px;"></div>
  </header>

  <div id="authGuard" style="display:flex;min-height:80vh;align-items:center;justify-content:center;">
    <p style="color:#666;">Checking authentication…</p>
  </div>

  <div id="pageContent" style="display:none;max-width:700px;margin:0 auto;padding:24px 16px 48px;">

    <div id="formSection" style="display:block;margin-top:0;">
      <form id="productForm" autocomplete="off">
        <div class="form-grid">

          <div class="form-group">
            <label for="fName">Product Name *</label>
            <input type="text" id="fName" placeholder="e.g. Mushroom Model" required inputmode="text">
          </div>

          <div class="form-group">
            <label for="fCategory">Category *</label>
            <select id="fCategory" required>
              <option value="">Loading categories…</option>
            </select>
          </div>

          <div class="form-row full">
            <div class="form-group">
              <label for="fSize">Size *</label>
              <input type="text" id="fSize" placeholder='e.g. 8"x11"' required inputmode="text">
            </div>
            <div class="form-group" style="grid-column:1/-1">
              <label>Color / Finish</label>
              <div id="colorChips" class="color-chips-wrap">
                <span style="color:#999;font-size:0.85rem">Loading colors…</span>
              </div>
            </div>
          </div>

          <div class="form-group full price-section">
            <label class="price-section-label">Pricing</label>

            <div class="radio-row" style="margin-bottom:14px;">
              <label class="radio-item">
                <input type="radio" name="priceType" id="priceTypePiece" value="piece" checked> Per Piece
              </label>
              <label class="radio-item">
                <input type="radio" name="priceType" id="priceTypeSqft" value="sqft"> Per Sq Ft
              </label>
            </div>

            <div class="form-row" id="pricePieceFields">
              <div class="form-group" style="margin-bottom:0">
                <label for="fPricePolish">Polished Price (₹)</label>
                <input type="number" id="fPricePolish" placeholder="0" min="0" inputmode="numeric">
              </div>
              <div class="form-group" style="margin-bottom:0">
                <label for="fPrice">Unpolished Price (₹)</label>
                <input type="number" id="fPrice" placeholder="0" min="0" inputmode="numeric">
              </div>
            </div>

            <div class="form-row" id="priceSqftFields" style="display:none">
              <div class="form-group" style="margin-bottom:0">
                <label for="fRatePolish">Polished Rate / sq ft (₹)</label>
                <input type="number" id="fRatePolish" placeholder="0" min="0" step="0.01" inputmode="decimal">
              </div>
              <div class="form-group" style="margin-bottom:0">
                <label for="fRate">Unpolished Rate / sq ft (₹)</label>
                <input type="number" id="fRate" placeholder="0" min="0" step="0.01" inputmode="decimal">
              </div>
              <div id="sqftPreviewWrap" style="display:none;grid-column:1/-1;margin-top:4px;">
                <div id="sqftCalcPreview" style="font-size:0.85rem;color:#444;padding:10px 12px;background:#f0f4ff;border-radius:8px;border:1px solid #d0d9ff"></div>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>Options</label>
            <div class="checkbox-row">
              <label class="check-item">
                <input type="checkbox" id="fFeatured"> Featured product
              </label>
              <label class="check-item">
                <input type="checkbox" id="fInStock" checked> In Stock
              </label>
            </div>
          </div>

          <div class="form-group full">
            <label for="fDesc">Description *</label>
            <textarea id="fDesc" placeholder="Describe the product – texture, use case, durability…" required></textarea>
          </div>

          <!-- Multi-image upload -->
          <div class="form-group full">
            <label>Photos / Videos</label>
            <div class="media-section">
              <div class="media-grid" id="mediaGrid">
                <div class="media-add-btn" id="mediaAddBtn">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
                  </svg>
                  Add Photos
                </div>
              </div>
              <input type="file" id="mediaInput" accept="image/*,video/*" multiple style="display:none">
              <p class="media-hint">Tap image to set as primary · Tap × to remove · First uploaded = primary by default</p>
            </div>
          </div>

        </div>

        <div class="form-actions">
          <button type="submit" class="btn-save" id="saveBtn">Save Product</button>
          <a href="index.html" class="btn-cancel" style="display:inline-flex;align-items:center;text-decoration:none;">Cancel</a>
        </div>
      </form>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/add-product.js"></script>
<script>if("serviceWorker"in navigator)navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
